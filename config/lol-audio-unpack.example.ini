[app]
# 必填：已安装客户端根目录，或外部工具准备的等价本地目录
# 目录必须符合 docs/api/prepared_source.md 中的本地数据源合同
game_path = D:/Games/Tencent/WeGameApps/英雄联盟

# 必填：输出目录
output_path = ./output

# 以下是常见默认值示例；保持注释即可沿用默认值
# game_region = zh_CN
# exclude_type = SFX,MUSIC
# group_by_type = false
# 解包前确认：true 将 VO/SFX/MUSIC 放到类型层，WAV 镜像实际 WEM 路径；不整理旧目录
# 大厅三种音频默认包含；设为 false 关闭，不受 exclude_type 影响
# lobby_audio = true
# wwiser_path =

[targets]
# 多个动作共享的实体范围；留空或保持注释表示全量
# champions = Annie,Ahri
# maps = 11,12

[runtime]
# 通用执行参数；不写则沿用默认值
# max_workers = 4

[update]
# enable = false
# 以下是默认值示例；通常不需要手动提供
# force = false
# skip_events = false

[extract]
# enable = false
# extract 动作当前没有其他独立参数

[wav]
# WAV 动作与其他动作同级；细节参数统一放在本分组
# enable = false
# wav_workers = 2
# wav_timeout = 5
# 最大尝试次数，包含首次；1 表示不自动重试
# wav_retries = 3
# 采样格式：auto / pcm16 / pcm24 / pcm32 / float；转码统一输出 WAV，默认 16 位整数 PCM
# wav_format = pcm16
# 仅对 WAV 有效，默认关闭；开启时另存 wavs_by_event，普通输出保留在 wavs
# 无可用精确映射的对象保持普通目录；有映射但无事件关联的音频进入“未关联事件”
# 本轮启用 mapping 时等待其结束再分类；切换选项不搬动或整理已有 WAV
# wav_group_by_event = false

[mapping]
# enable = false
# 以下是默认值示例；通常不需要手动提供
# integrate_data = true
